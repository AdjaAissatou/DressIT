{% load i18n %}

    <a href="{% url 'manage_categories' %}" class="{% if url == 'manage_categories' or url == 'manage_category_edit' or url == 'manage_category_add' %}active{% endif %}">🗂️ {% trans "Catégories" %}</a>
    <a href="{% url 'admin:store_order_changelist' %}">🧾 {% trans "Commandes" %}</a>
